services:
  - type: web
    name: online-forever
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -u main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_STATUS
        value: online
      - key: CUSTOM_STATUS
        value: "Hey!"
